plugins { id 'com.android.application' }

android {
    namespace 'com.soulswap.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.soulswap.game'
        minSdk 26
        targetSdk 28
        versionCode 5
        versionName '0.4.0-test'
    }
    // Private key is supplied ONLY via runner secret or local environment.
    def stableFile = System.getenv('SOULSWAP_SIGNING_FILE')
    def stablePass = System.getenv('SOULSWAP_SIGNING_PASSWORD')
    signingConfigs {
        permanent {
            if (stableFile && stablePass) {
                storeFile file(stableFile)
                storePassword stablePass
                keyAlias 'soulswap-update'
                keyPassword stablePass
                storeType 'pkcs12'
            }
        }
    }
    buildTypes {
        debug {
            minifyEnabled false
            if (stableFile && stablePass) signingConfig signingConfigs.permanent
        }
        release { minifyEnabled false }
    }
    lint { disable 'ExpiredTargetSdkVersion' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
